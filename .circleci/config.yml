version: 2.1

orbs:
  node: circleci/node@6.2.0

jobs:
  build_and_test:
    docker:
      - image: cimg/node:20.11  # ✅ Node 20 environment
    working_directory: ~/project
    steps:
      - checkout

      # 🧱 Install backend dependencies
      - run:
          name: Install Backend Dependencies
          command: |
            cd backend
            npm install

      # 🧪 Run backend tests (mock DB, avoid real connection)
      - run:
          name: Run Backend Tests (Mock DB)
          command: |
            cd backend
            export NODE_ENV=test
            export MONGO_URL="mock://memory-db"
            jest --runInBand --detectOpenHandles --testTimeout=15000

      # 🧱 Install frontend dependencies
      - run:
          name: Install Frontend Dependencies
          command: |
            cd frontend
            npm install

      # 🧪 Run frontend tests
      - run:
          name: Run Frontend Tests
          command: |
            cd frontend
            npm test -- --watchAll=false --ci

      # 🧰 Build frontend
      - run:
          name: Build Frontend
          command: |
            cd frontend
            npm run build

workflows:
  version: 2
  test_and_build:
    jobs:
      - build_and_test
