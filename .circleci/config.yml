version: 2.1

orbs:
  node: circleci/node@6.2.0

jobs:
  build_and_test:
    docker:
      - image: cimg/node:20.11  # ✅ Node 20 environment
    working_directory: ~/project

    steps:
      - checkout

      # 🧱 Install backend dependencies
      - run:
          name: Install Backend Dependencies
          command: |
            cd backend
            npm install

      # 🧪 Run backend tests (mock DB)
      - run:
          name: Run Backend Tests (Mock DB)
          command: |
            cd backend
            export NODE_ENV=test
            export MONGO_URL="mock://memory-db"
            npm test -- --runInBand --detectOpenHandles --testTimeout=15000

      # 🧱 Install frontend dependencies
      - run:
          name: Install Frontend Dependencies
          command: |
            cd frontend
            npm install

      # 🧰 Build frontend first (using the real /src directory)
      - run:
          name: Build Frontend
          command: |
            cd frontend
            npm run build

      # ⚙️ (Optional) Create mock /src folder for CRA-based test config
      - run:
          name: Prepare Frontend Tests
          command: |
            echo "Preparing mock /src directory for CRA tests..."
            rm -rf frontend/src
            mkdir -p frontend/src
            cp -r frontend/{components,pages,redux,theme,assets} frontend/src/ || true
            cp frontend/{App.js,index.js,index.css,setupTests.js,reportWebVitals.js} frontend/src/ || true
            echo "Frontend /src directory ready!"

      # 🧪 Run frontend tests (CI mode)
      - run:
          name: Run Frontend Tests
          command: |
            cd frontend
            npm test -- --watchAll=false --ci

workflows:
  version: 2
  test_and_build:
    jobs:
      - build_and_test
