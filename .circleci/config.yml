version: 2.1

orbs:
  node: circleci/node@6.2.0

jobs:
  build_and_test:
    docker:
      - image: cimg/node:20.11
    working_directory: ~/project

    steps:
      - checkout

      # 🧱 Install backend dependencies
      - run:
          name: Install Backend Dependencies
          command: |
            cd backend
            npm install

      # 🧪 Run backend tests (mock DB)
      - run:
          name: Run Backend Tests (Mock DB)
          command: |
            cd backend
            export NODE_ENV=test
            export MONGO_URL="mock://memory-db"
            npm test -- --runInBand --detectOpenHandles --testTimeout=15000

      # 🧱 Install frontend dependencies
      - run:
          name: Install Frontend Dependencies
          command: |
            cd frontend
            npm install

      # ⚙️ Prepare full frontend /src folder for CRA test environment
      - run:
          name: Prepare Frontend Test Environment
          command: |
            echo "🧩 Preparing full /src directory for CRA tests..."
            cd frontend
            mkdir -p src
            # ✅ Copy everything from real src (recursive, preserving structure)
            rsync -a --exclude=node_modules ./src/ ./src/
            # ✅ Ensure key root-level files are there
            cp App.js src/ || true
            cp index.js src/ || true
            cp index.css src/ || true
            cp setupTests.js src/ || true
            echo "✅ Frontend /src directory ready for Jest!"

      # 🧪 Run frontend tests
      - run:
          name: Run Frontend Tests
          command: |
            cd frontend
            npm test -- --watchAll=false --ci

      # 🧹 Cleanup mock src folder (restore real repo)
      - run:
          name: Cleanup Mock Frontend Files
          command: |
            echo "🧹 Cleaning up temporary /src test structure..."
            cd frontend
            rm -rf src
            git restore src || true
            echo "✅ Original frontend/src restored."

      # 🧰 Build frontend for deployment
      - run:
          name: Build Frontend
          command: |
            cd frontend
            npm run build

workflows:
  version: 2
  test_and_build:
    jobs:
      - build_and_test
